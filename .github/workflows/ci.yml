name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  linux-gcc-debug:
    name: linux-gcc-debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive # TI-008 removes the vcpkg submodule
          persist-credentials: false

      # The vcpkg toolchain file is hardcoded in CMakeLists.txt until TI-009,
      # and bootstraps vcpkg itself on first configure.
      - uses: ./.github/actions/setup-build
        with:
          compiler: gcc
          build-type: Debug

      - name: Build
        run: cmake --build build --parallel

      # enable_testing() lives in tests/CMakeLists.txt, so the tests are
      # registered in build/tests rather than at the top level.
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure --output-junit "$GITHUB_WORKSPACE/junit.xml"

      - name: Summarise test results
        if: always()
        run: scripts/junit-summary.py junit.xml linux-gcc-debug

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-linux-gcc-debug
          path: junit.xml
          if-no-files-found: ignore
